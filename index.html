<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIB Mobile Banking</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="cib-container">
    <!-- Status Bar -->
    <div class="status-bar">CIB Mobile Banking</div>

    <!-- App Header -->
    <div class="app-header">
        <div class="cib-logo">CIB</div>
        <div class="menu-icon">☰</div>
    </div>

    <!-- Account Card -->
    <div class="account-card">
        <div class="client-name">Adel Hafez</div>
        <div class="account-info">
            <div class="account-type">Savings Account</div>
            <div class="account-number">••••5362</div>
        </div>
        <div class="balance-container">
            <div class="balance-label">Available Balance</div>
            <div class="balance-amount">EGP 812,354</div>
        </div>
    </div>

    <!-- Quick Actions -->
    <div class="quick-actions">
        <a href="transfer.html" class="action-item">
            <div class="action-icon">⇄</div>
            <div class="action-label">Transfer</div>
        </a>
        <!-- Other action items -->
    </div>

    <!-- Transactions Section -->
    <div class="transactions-header">
        <div class="section-title">Recent Transactions</div>
        <a href="transactions.html" class="see-all">See All</a>
    </div>

    <div class="transactions-list">
        <!-- Transaction items -->
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <!-- Nav items -->
    </div>
</div>
<script src="js/main.js"></script>
</body>
</html>
